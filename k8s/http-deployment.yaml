apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-server-deployment
  labels:
    app: http-sever
spec:
  replicas: 3
  selector:
    matchLabels:
      app: http-server
  template:
    metadata:
      labels:
        app: http-server
    spec:
      containers:
        - name: http-server
          image: http-server:1.0
          env:
            - name: HOST
              value: ""
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
