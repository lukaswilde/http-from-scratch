apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-server-deployment
  labels:
    app: http-sever
spec:
  replicas: 3
  selector:
    matchLabels:
      app: http-server
  template:
    metadata:
      labels:
        app: http-server
    spec:
      containers:
        - name: http-server
          image: http-server:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: HOST
              value: ""
            - name: PORT
              value: "8080"
            - name: OTEL_SERVICE_NAME
              value: "user-service"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://vtsingle-vmstack-victoria-metrics-k8s-stack.default.svc:10428/insert/opentelemetry/v1/traces"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
          ports:
            - containerPort: 8080
